# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: roast

snapshot:
  version_template: '{{ if index .Env "ROAST_PREVIEW_VERSION" }}{{ index .Env "ROAST_PREVIEW_VERSION" }}{{ else }}{{ .Version }}-SNAPSHOT-{{ .ShortCommit }}{{ end }}'

before:
  hooks:
    - bash scripts/licenses.sh

builds:
  - id: roast
    binary: "{{ if .IsSnapshot }}roast-preview{{ else }}roast{{ end }}"
    main: ./cmd/roast
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X github.com/bluesky-social/roast/internal/buildinfo.Version={{ if .IsSnapshot }}{{ .Version }}{{ else }}{{ .Tag }}{{ end }}
      - -X github.com/bluesky-social/roast/internal/buildinfo.Commit={{ .ShortCommit }}
      - -X github.com/bluesky-social/roast/internal/buildinfo.Date={{ .CommitDate }}

archives:
  - id: roast
    ids: [roast]
    formats: [tar.gz]
    name_template: "{{ if .IsSnapshot }}roast-preview{{ else }}{{ .ProjectName }}{{ end }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds_info:
      owner: root
      group: root
      mtime: "{{ .CommitDate }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - src: LICENSE.txt
        info: &file_info
          owner: root
          group: root
          mtime: "{{ .CommitDate }}"
      - src: LICENSE-APACHE.txt
        info: *file_info
      - src: LICENSE-MIT.txt
        info: *file_info
      - src: README.md
        info: *file_info
      - src: SECURITY.md
        info: *file_info
      - src: THIRD_PARTY_LICENSES/*
        info: *file_info

checksum:
  name_template: "{{ if .IsSnapshot }}roast-preview{{ else }}{{ .ProjectName }}{{ end }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  # Release Please creates the tag and a draft. GoReleaser reuses the draft,
  # preserves its notes, and publishes only after its artifacts are uploaded.
  use_existing_draft: true
  mode: keep-existing

# Keep the existing cask identity so current installations upgrade in place.
homebrew_casks:
  - name: roast
    ids: [roast]
    binaries: ["{{ if .IsSnapshot }}roast-preview{{ else }}roast{{ end }}"]
    directory: Casks
    description: "Adversarial cross-model code review CLI"
    homepage: https://github.com/bluesky-social/roast
    caveats: |
      Configure inference following the README, or use a trusted configuration URL:
        roast config init --from <trusted-configuration-url>
      Then check your setup and install the bundled Agent Skill:
        roast doctor
        roast skill install
      The first interactive review offers to enable the pre-commit gate.
    repository:
      owner: bluesky-social
      name: homebrew-tap
      branch: main
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    url:
      template: "https://github.com/bluesky-social/roast/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
      using: GhReleaseStrategy
    custom_block: |
      class GhReleaseStrategy < CurlDownloadStrategy
        def initialize(url, name, version, **meta)
          super
          unless %r{\Ahttps://github\.com/([^/]+)/([^/]+)/releases/download/([^/]+)/([^/]+)\z} =~ @url
            raise CurlDownloadStrategyError, "unexpected release URL: #{@url}"
          end
          @gh_owner, @gh_repo, @gh_tag, @gh_asset =
            Regexp.last_match(1), Regexp.last_match(2), Regexp.last_match(3), Regexp.last_match(4)
        end

        private

        def _fetch(url:, resolved_url:, timeout:)
          # Public releases use Homebrew's normal download without requiring gh.
          begin
            return super
          rescue ErrorDuringExecution
            # Private releases return 404 anonymously; use the user's gh login.
          end

          candidates = (ENV["HOMEBREW_PATH"] || "").split(":").map { |d| File.join(d, "gh") }
          candidates += ["#{HOMEBREW_PREFIX}/bin/gh", "/opt/homebrew/bin/gh", "/usr/local/bin/gh"]
          gh = candidates.find { |p| File.executable?(p) } || which("gh")&.to_s
          unless gh
            raise CurlDownloadStrategyError,
                  "gh is required for private release downloads; run: brew install gh && gh auth login"
          end
          unless SystemCommand.quiet_system(gh, "auth", "status", "--hostname", "github.com")
            raise CurlDownloadStrategyError,
                  "gh is not authenticated; run: gh auth login"
          end
          ok = system(gh, "release", "download", @gh_tag,
                      "--repo", "#{@gh_owner}/#{@gh_repo}",
                      "--pattern", @gh_asset,
                      "--output", temporary_path.to_s, "--clobber")
          return if ok && temporary_path.exist? && !temporary_path.empty?

          raise CurlDownloadStrategyError,
                "gh failed to download #{@gh_asset} from #{@gh_owner}/#{@gh_repo}@#{@gh_tag}"
        end
      end

      # GoReleaser's hooks still emit the deprecated postflight stanza.
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "."], chdir: "."
        end
      end
