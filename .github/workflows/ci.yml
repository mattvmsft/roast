name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    name: Test and build
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            .github/tools/*/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [[ -n "${unformatted}" ]]; then
            echo "${unformatted}"
            exit 1
          fi

      - name: Check module files
        run: |
          set -euo pipefail
          go mod tidy
          for modfile in .github/tools/*/go.mod; do
            (cd "${modfile%/*}" && go mod tidy)
          done
          git diff --exit-code -- go.mod go.sum .github/tools
          # git diff alone does not report a missing go.sum recreated by tidy.
          test -z "$(git ls-files --others --exclude-standard -- go.mod go.sum .github/tools)"

      - name: Check workflows and shell scripts
        run: |
          go tool -modfile=.github/tools/actionlint/go.mod actionlint
          shellcheck scripts/*.sh

      - name: Check release configuration
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.19.0
          args: check

      - name: Test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        # Keep the importer compatible with the compiler without adding
        # CI-only tool dependencies to Roast's runtime module.
        run: go tool -modfile=.github/tools/staticcheck/go.mod staticcheck ./...

      - name: Build upload broker
        run: go build ./cmd/roast-broker

      - name: Compile Windows
        env:
          CGO_ENABLED: "0"
          GOARCH: amd64
          GOOS: windows
        run: go build -o /tmp/roast.exe ./cmd/roast

      - name: Set up container builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build broker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: roast-broker:ci
          cache-from: type=gha,scope=broker
          cache-to: type=gha,scope=broker,mode=max

      - name: Smoke test broker image
        run: bash scripts/test-broker-image.sh roast-broker:ci

  security:
    name: Security and licenses
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            .github/tools/*/go.sum

      - name: Scan Git history for secrets
        run: go tool -modfile=.github/tools/gitleaks/go.mod gitleaks git --redact --no-banner .

      - name: Check reachable vulnerabilities
        run: go tool -modfile=.github/tools/govulncheck/go.mod govulncheck ./...

      - name: Check dependency licenses
        run: >-
          go tool -modfile=.github/tools/licenses/go.mod go-licenses check ./...
          --allowed_licenses=Apache-2.0,BSD-2-Clause,BSD-3-Clause,ISC,MIT,MPL-2.0,Unlicense

      - name: Generate release license notices for all targets
        run: bash scripts/licenses.sh
