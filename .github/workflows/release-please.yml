name: release-please

# Release automation via the org reusable workflow (the `release` job below).
# Push-to-main maintains a standing Release PR. A range made only of merged
# Renovate/Dependabot PRs merges itself on weekdays 09-16 PT; anything
# human-authored waits for a human (label `release:manual` to hold one).
# Merging creates the tag + GitHub release, then the release_created-gated
# jobs below run.
#
# goreleaser runs HERE because the reusable creates tags with GITHUB_TOKEN,
# which does not trigger another workflow. There is no tag-triggered
# release.yml: a hand-pushed tag bypasses release-please's manifest. To
# recover a failed release, fix the cause and re-run this workflow's failed
# jobs on the original run, which keeps its release outputs and reuses the
# draft (CONTRIBUTING.md, "Stable releases and Homebrew").

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  # Hourly across the weekday release window (UTC; covers 09-16 PT in both PST
  # and PDT) so a dependency range merged overnight ships when it opens.
  schedule:
    - cron: '23 16-23 * * 1-5'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release:
    uses: bluesky-social/.github/.github/workflows/release-please.yml@v1
    with:
      component: roast
    # The public-repo release App: the org-wide release App's credentials are
    # not readable from public repositories.
    secrets:
      RELEASE_APP_ID: ${{ secrets.PUBLIC_RELEASE_APP_ID }}
      RELEASE_APP_KEY: ${{ secrets.PUBLIC_RELEASE_APP_KEY }}

  binaries:
    name: Release binaries
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      # Fail early on a stable release without blocking routine release-PR
      # updates. GITHUB_TOKEN cannot write to another repository, so mint a
      # short-lived installation token from the public release App, scoped to
      # the tap. Minting fails unless the App is installed on the tap and
      # grants contents write.
      - name: Mint homebrew-tap token
        id: tap-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.PUBLIC_RELEASE_APP_ID }}
          private-key: ${{ secrets.PUBLIC_RELEASE_APP_KEY }}
          owner: bluesky-social
          repositories: homebrew-tap
          permission-contents: write

      - name: Check tap publishing credential
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
        run: |
          set -euo pipefail
          repos="$(gh api installation/repositories --jq '.repositories[].full_name')"
          if ! grep -qx 'bluesky-social/homebrew-tap' <<<"${repos}"; then
            echo "The minted App token must have access to bluesky-social/homebrew-tap"
            exit 1
          fi

      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            .github/tools/*/go.sum

      - name: Test
        run: go test ./...

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Cross-repo cask push with the minted App token.
          TAP_GITHUB_TOKEN: ${{ steps.tap-token.outputs.token }}
